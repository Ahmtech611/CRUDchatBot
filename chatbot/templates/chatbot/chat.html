<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Console — Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 50%, #0F766E 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 660px;
    height: 720px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    background: linear-gradient(135deg, #101828, #1E3A5F);
    color: #fff;
    padding: 20px 26px;
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .topbar .avatar {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .topbar .avatar i { font-size: 16px; }
  .topbar-title { font-size: 16px; font-weight: 700; }
  .topbar-sub { font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    padding : 10px 6px;
    border-radius: 14px;
    font-size: 16.5px;
    line-height: 1.5;
    box-shadow: 0 1px 2px rgba(16,24,40,0.06);
  }
  .bot {
    background: #fff;
    color: #101828;
    max-width: 100%;
    align-self: flex-start;
    margin-left: 7vw;
    border-bottom-left-radius: 8px;
    border-top-right-radius: 8px;
    border-top-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }
  .user {
    background: linear-gradient(135deg, #101828, #1E3A5F);
    color: #fff;
    max-width: 100%;
    align-self: flex-end;
    margin-right: 5vw;
    border-bottom-left-radius: 8px;
    border-top-right-radius: 8px;
    border-top-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }
  .input-bar {
    display: flex;
    gap: 10px;
    padding: 10px;
    border-top: 1px solid #E3E8EF;
    background: #fff;
  }
  .input-bar input {
    flex: 1;
    border: 1.5px solid #E3E8EF;
    border-radius: 11px;
    padding: 13px 15px;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-bar input:focus {
    border-color: #0F766E;
    box-shadow: 0 0 0 4px rgba(15,118,110,0.12);
  }
  .input-bar button {
    border: none;
    background: linear-gradient(135deg, #101828, #1E3A5F);
    color: #fff;
    width: 46px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 4px 12px rgba(16,24,40,0.25);
    transition: transform 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .input-bar button:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
    <div>
      <div class="topbar-title">User Management Console</div>
      <div class="topbar-sub">{{ email }}</div>
    </div>
  </div>

  <div class="messages" id="chatMessages"></div>

  <div class="input-bar">
    <input type="text" id="messageInput" placeholder="Type a command..." autofocus>
    <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<script>
  function getCookie(name) {
    let value = `; ${document.cookie}`;
    let parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }
  const csrftoken = getCookie('csrftoken');

  function addMessage(text, sender) {
    const messagesDiv = document.getElementById('chatMessages');
    const row = document.createElement('div');
    row.className = 'row ' + sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + sender;
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesDiv.appendChild(row);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    input.value = '';

    fetch("{% url 'chat_view' %}", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrftoken },
      body: JSON.stringify({ message: message })
    })
    .then(response => response.json())
    .then(data => addMessage(data.response, 'bot'))
    .catch(() => addMessage("Something went wrong. Please try again.", 'bot'));
  }

  document.getElementById('messageInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
