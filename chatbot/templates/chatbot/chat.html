<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Console — Chat</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;

    background:
      radial-gradient(
        circle at 10% 15%,
        rgba(15, 118, 110, 0.10),
        transparent 30%
      ),
      radial-gradient(
        circle at 90% 85%,
        rgba(30, 58, 95, 0.12),
        transparent 30%
      ),
      linear-gradient(
        135deg,
        #edf3f6 0%,
        #e5ecf2 100%
      );

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;
  }
   

  .app {
    width: 100%;
    max-width: 700px;
    height: 75vh;

    background: #ffffff;

    border-radius: 18px;

    border: 1px solid #dfe6ec;

    box-shadow:
      0 20px 45px rgba(16, 24, 40, 0.15),
      0 4px 12px rgba(16, 24, 40, 0.05);

    display: flex;
    flex-direction: column;

    overflow: hidden;
  }


  /* Top of chat box */

  .topbar {
    background: linear-gradient(
      135deg,
      #101828,
      #1e3a5f
    );

    color: #fff;

    padding: 18px 24px;

    display: flex;
    align-items: center;

    gap: 12px;
  }

  .topbar .avatar {
    width: 40px;
    height: 40px;

    border-radius: 10px;

    background: rgba(255, 255, 255, 0.10);

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
  }

  .topbar .avatar i {
    font-size: 16px;
  }

  .topbar-title {
    font-size: 16px;
    font-weight: 650;
  }

  .topbar-sub {
    font-size: 12px;

    color: rgba(255, 255, 255, 0.62);

    margin-top: 3px;
  }


  /* Chat messages */

  .messages {
    flex: 1;

    overflow-y: auto;

    padding: 24px 22px;

    display: flex;
    flex-direction: column;

    gap: 14px;

    background:
      radial-gradient(
        circle at 5% 10%,
        rgba(15, 118, 110, 0.04),
        transparent 25%
      ),
      linear-gradient(
        180deg,
        #f8fafc 0%,
        #f3f6f8 100%
      );

    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
  }
  

  .messages::-webkit-scrollbar {
    width: 6px;
  }

  .messages::-webkit-scrollbar-track {
    background: transparent;
  }

  .messages::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }


  /*Message rows */

  .row {
    display: flex;
    width: 100%;
  }

  .row.bot {
    justify-content: flex-start;
  }

  .row.user {
    justify-content: flex-end;
  }


  /* same bubble */

  .row .bubble {
    display: block;

    width: fit-content;

    max-width: 72%;

    padding: 11px 15px;

    border-radius: 13px;

    font-size: 14px;

    line-height: 1.5;

    word-wrap: break-word;

    overflow-wrap: anywhere;

    box-shadow:
      0 2px 6px rgba(16, 24, 40, 0.05);
  }


  /* Chatbot bubble */

  .row.bot .bubble {
    background: #ffffff;

    color: #101828;

    border: 1px solid #e1e7ed;

    border-bottom-left-radius: 5px;

    align-self: flex-start;
  }


  /*User bubble */

  .row.user .bubble {
    background: linear-gradient(
      135deg,
      #101828,
      #1e3a5f
    );

    color: #ffffff;

    border: 1px solid rgba(30, 58, 95, 0.35);

    border-bottom-right-radius: 5px;

    align-self: flex-end;

    box-shadow:
      0 3px 9px rgba(16, 24, 40, 0.13);
  }



  .input-bar {
    display: flex;

    gap: 10px;

    padding: 14px;

    border-top: 1px solid #e2e8f0;

    background: #ffffff;
  }

  .input-bar input {
    flex: 1;

    min-width: 0;

    border: 1px solid #d8e0e7;

    background: #f8fafc;

    color: #101828;

    border-radius: 10px;

    padding: 12px 14px;

    font-size: 14px;

    outline: none;

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }

  .input-bar input::placeholder {
    color: #98a2b3;
  }

  .input-bar input:focus {
    background: #ffffff;

    border-color: #0f766e;

    box-shadow:
      0 0 0 3px rgba(15, 118, 110, 0.10);
  }


  /* Send button */

  .input-bar button {
    border: none;

    background: linear-gradient(
      135deg,
      #101828,
      #1e3a5f
    );

    color: #fff;

    width: 46px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

    box-shadow:
      0 4px 10px rgba(16, 24, 40, 0.18);

    transition:
      transform 0.15s ease,
      box-shadow 0.15s ease;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  .input-bar button:hover {
    transform: translateY(-1px);

    box-shadow:
      0 6px 14px rgba(16, 24, 40, 0.22);
  }

  .input-bar button:active {
    transform: translateY(0);
  }


  /* Responsive related*/

  @media (max-width: 720px) {

    body {
      padding: 12px;
    }

    .app {
      height: calc(100vh - 24px);

      border-radius: 15px;
    }

    .messages {
      padding: 18px 14px;
    }

    .row .bubble {
      max-width: 82%;
    }
  }


  @media (max-width: 420px) {

    .topbar {
      padding: 16px 18px;
    }

    .input-bar {
      padding: 11px;
    }

    .input-bar button {
      width: 44px;
    }
  }

</style>

</head>

<body>

<div class="app">

  <div class="topbar">

    <div class="avatar">
      <i class="fa-solid fa-robot"></i>
    </div>

    <div>
      <div class="topbar-title">User Management Console</div>
      <div class="topbar-sub">{{ email }}</div>
    </div>

  </div>


  <div class="messages" id="chatMessages"></div>


  <div class="input-bar">

    <input
      type="text"
      id="messageInput"
      placeholder="Type a command..."
      autofocus
    >

    <button onclick="sendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>

  </div>

</div>


<script>

  function getCookie(name) {
    let value = `; ${document.cookie}`;
    let parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }

  const csrftoken = getCookie('csrftoken');

  function addMessage(text, sender) {
    const messagesDiv = document.getElementById('chatMessages');
    const row = document.createElement('div');
    row.className = 'row ' + sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + sender;
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesDiv.appendChild(row);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    input.value = '';

    fetch("{% url 'chat_view' %}", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrftoken },
      body: JSON.stringify({ message: message })
    })
    .then(response => response.json())
    .then(data => addMessage(data.response, 'bot'))
    .catch(() => addMessage("Something went wrong. Please try again.", 'bot'));
  }

  document.getElementById('messageInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });

</script>

</body>
</html>
