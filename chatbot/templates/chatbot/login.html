<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Console — Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 50%, #0F766E 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 410px;
    background: rgba(255,255,255,0.98);
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    padding: 44px 40px;
  }

  .icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #0F766E, #101828);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    margin-bottom: 22px;
    box-shadow: 0 6px 16px rgba(15,118,110,0.3);
  }

  .icon i { font-size: 20px; }
  .card h2 {
    margin: 0 0 6px;
    font-size: 23px;
    color: #101828;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .card > p {
    margin: 0 0 30px;
    font-size: 13.5px;
    color: #667085;
    line-height: 1.5;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #344054;
    margin-bottom: 7px;
  }

  .input-wrap { position: relative; }
  .input-wrap i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #98A2B3;
    font-size: 14px;
  }

  .field input {
    width: 100%;
    padding: 13px 14px 13px 40px;
    border: 1.5px solid #E3E8EF;
    border-radius: 11px;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .field input:focus {
    border-color: #0F766E;
    box-shadow: 0 0 0 4px rgba(15,118,110,0.12);
  }
  
  /*Submit button  */
  
  button.submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #101828, #1E3A5F);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s, box-shadow 0.15s;
    box-shadow: 0 6px 18px rgba(16,24,40,0.28);
  }

  /* Hover related CSS */
  button.submit:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(16,24,40,0.34); }
  button.submit:active { transform: translateY(0); }
  .error {
    display: flex;
    gap: 9px;
    align-items: center;
    background: #FEF3F2;
    border: 1px solid #FDA29B;
    color: #B42318;
    font-size: 13px;
    padding: 11px 14px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h2>Sign in</h2>
    <p>Enter the email registered in the system to continue.</p>

    {% if error %}
    <div class="error"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="field">
        <label>Email address</label>
        <div class="input-wrap">
          <i class="fa-regular fa-envelope"></i>
          {{ form.email }}
        </div>
      </div>
      <button type="submit" class="submit">
        Continue <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>
</body>
</html>
